  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"80b8d63f-9f25-4832-9d4a-6cd5d8a8a459\"><\u002Fscript>\n<script src=\"2db07e07-4593-46db-8b56-0fd568c1d68a\"><\u002Fscript>\n<style>\n  body { margin: 0; text-wrap: pretty; overflow-x: clip; color: var(--color-text); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-800); text-decoration: underline; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav class=\"nav\" style=\"position:relative; z-index:1; flex-wrap:wrap; row-gap:12px; padding-inline: max(clamp(20px,5vw,72px), calc((100% - 1160px) / 2 + clamp(20px,5vw,72px)))\">\n  <span class=\"nav-brand\" style=\"white-space:nowrap\">Guia de Cuidados · Mounjaro<\u002Fspan>\n  <a href=\"#conteudo\" style=\"white-space:nowrap\">O que você recebe<\u002Fa>\n  <a href=\"#duvidas\" style=\"white-space:nowrap\">Dúvidas<\u002Fa>\n  <a href=\"{{ checkoutUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"text-decoration:none\">Quero o guia<\u002Fa>\n<\u002Fnav>\n\n<div style=\"max-width:1160px; margin:0 auto; padding:0 clamp(20px,5vw,72px)\">\n\n  <section style=\"position:relative; padding:112px 0 84px\">\n    <div style=\"position:absolute; right:0; top:-220px; width:420px; height:420px; border-radius:50%; background:var(--color-accent-2-200); z-index:0; pointer-events:none\"><\u002Fdiv>\n    <h1 style=\"position:relative; font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(38px,5.2vw,68px); line-height:1.08; letter-spacing:0; margin:0 0 0 -0.028em; max-width:19ch\">\n      <span style=\"display:block\">Você aplicou a primeira dose<\u002Fspan>\n      <span style=\"display:block\">e agora não sabe em quem confiar.<\u002Fspan>\n    <\u002Fh1>\n    <p style=\"position:relative; font-size:17px; line-height:28px; max-width:58ch; margin:28px 0 0\">Guia completo de cuidados durante o tratamento com Mounjaro (tirzepatida) — com fonte científica em cada recomendação. Não é promessa fácil, é ciência organizada para você.<\u002Fp>\n    <div style=\"position:relative; display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:center; margin-top:28px\">\n      <a href=\"{{ checkoutUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"text-decoration:none\">Quero o guia completo<\u002Fa>\n      <span style=\"font-size:14px; line-height:28px; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Garantia incondicional de 7 dias<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-label=\"O guia em números\" style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:28px 14px; justify-items:center; padding:14px 0 70px\">\n    <div style=\"width:min(240px,100%); aspect-ratio:1; border-radius:50%; background:var(--color-accent-100); display:grid; place-content:center; text-align:center; padding:28px; box-sizing:border-box\">\n      <p style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:44px; line-height:56px; margin:0; color:var(--color-accent-700)\">4<\u002Fp>\n      <p style=\"font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin:14px 0 0; max-width:17ch; text-wrap:balance; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Sociedades científicas dos EUA no consenso<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:min(240px,100%); aspect-ratio:1; border-radius:50%; background:var(--color-accent-2-300); display:grid; place-content:center; text-align:center; padding:28px; box-sizing:border-box; transform:translateY(28px)\">\n      <p style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:44px; line-height:56px; margin:0; color:var(--color-accent-2-800)\">26%<\u002Fp>\n      <p style=\"font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin:14px 0 0; max-width:17ch; text-wrap:balance; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Do peso perdido pode ser músculo<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:min(240px,100%); aspect-ratio:1; border-radius:50%; background:var(--color-accent-200); display:grid; place-content:center; text-align:center; padding:28px; box-sizing:border-box\">\n      <p style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:44px; line-height:56px; margin:0; color:var(--color-accent-700)\">40+<\u002Fp>\n      <p style=\"font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin:14px 0 0; max-width:17ch; text-wrap:balance; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Perguntas respondidas com evidência<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"width:min(240px,100%); aspect-ratio:1; border-radius:50%; background:var(--color-accent-2-100); display:grid; place-content:center; text-align:center; padding:28px; box-sizing:border-box; transform:translateY(28px)\">\n      <p style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:44px; line-height:56px; margin:0; color:var(--color-accent-2-700)\">7<\u002Fp>\n      <p style=\"font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; margin:14px 0 0; max-width:17ch; text-wrap:balance; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Dias de garantia, sem perguntas<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:84px 0 56px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:28px clamp(24px,5vw,96px); align-items:start\">\n    <div>\n      <span style=\"display:block; font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700); margin:0 0 14px\">Por que isso confunde<\u002Fspan>\n      <h2 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(26px,3vw,34px); line-height:1.2; margin:0\">Três vídeos, três respostas, nenhuma fonte.<\u002Fh2>\n      <p style=\"font-size:16.5px; line-height:28px; max-width:56ch; margin:28px 0 0\">Você aplicou a primeira dose há alguns dias. No mesmo dia, abre o celular e encontra três vídeos diferentes — um dizendo que você precisa comer muita proteína ou vai perder todo o músculo, outro afirmando que o cabelo vai cair de qualquer jeito, um terceiro garantindo que basta tomar a caneta que o resto se resolve sozinho.<\u002Fp>\n      <p style=\"font-size:16.5px; line-height:28px; max-width:56ch; margin:28px 0 0; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Nenhum deles cita uma fonte. Nenhum explica o porquê. E no fim, você fica mais confuso do que antes de abrir o aplicativo. Não é falta de informação — é excesso de informação sem filtro, sem fonte, sem compromisso com a realidade científica.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--color-accent-2-100); border-radius:32px; padding:36px clamp(24px,3vw,40px)\">\n      <span style=\"display:block; font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700); margin:0 0 18px\">Construído a partir de<\u002Fspan>\n      <ul style=\"list-style:none; margin:0; padding:0; display:grid; gap:18px\">\n        <li style=\"font-size:15.5px; line-height:26px\"><strong>SURMOUNT-1<\u002Fstrong> — ensaio clínico de fase 3 (New England Journal of Medicine, 2022)<\u002Fli>\n        <li style=\"font-size:15.5px; line-height:26px\"><strong>Parecer conjunto de 4 sociedades científicas dos EUA<\u002Fstrong> — ACLM, ASN, OMA e The Obesity Society (2025)<\u002Fli>\n        <li style=\"font-size:15.5px; line-height:26px\"><strong>Estudos de 2024–2026<\u002Fstrong> sobre massa muscular, queda de cabelo e flacidez de pele durante o tratamento<\u002Fli>\n      <\u002Ful>\n      <p style=\"font-size:15px; line-height:26px; margin:28px 0 0; color:color-mix(in srgb, var(--color-text) 80%, transparent)\">Cada recomendação importante traz um <strong>selo de força de evidência<\u002Fstrong> (★★★★★ a ★★☆☆☆). Quando a ciência ainda não tem certeza, o guia diz isso abertamente.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"conteudo\" style=\"padding:56px 0 28px\">\n    <span style=\"display:block; font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700); margin:0 0 14px\">O que você recebe<\u002Fspan>\n    <h2 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(28px,3.4vw,40px); line-height:1.12; margin:0 0 42px; max-width:20ch\">Ciência organizada, em linguagem de gente.<\u002Fh2>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Sintoma esperado ou alerta?<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Como diferenciar o que faz parte do processo do que pede uma ligação para o médico — sem alarmismo e sem negligência.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Cardápio para os dias sem apetite<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Refeições prontas e fontes de proteína práticas para quando a fome simplesmente não aparece.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Emagrecer preservando músculo<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">A maioria perde massa magra sem perceber — dado real do SURMOUNT-1. O capítulo 6 mostra proteína, treino e ritmo para evitar isso.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Queda de cabelo, sem mito<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">O que a pesquisa mais recente (2025–2026) realmente diz — e o que ainda é incerto, declarado como incerto.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Ferramentas de acompanhamento<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Checklist semanal, diário de sintomas e planner de refeições prontos para imprimir ou preencher.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr)); gap:6px clamp(24px,4vw,72px); align-items:baseline; padding:20px 0\">\n      <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:24px; line-height:28px; margin:0\">Mais de 40 perguntas frequentes<\u002Fh3>\n      <p style=\"font-size:15.5px; line-height:28px; margin:0; max-width:52ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Respondidas com base em evidência, não em achismo — cada uma com o seu selo de força.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:28px clamp(24px,5vw,96px); align-items:center; padding:56px 0 84px\">\n    <div>\n      <span style=\"display:block; font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700); margin:0 0 14px\">O material<\u002Fspan>\n      <h2 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(26px,3vw,32px); line-height:1.3; margin:0\">Um PDF que você lê no celular, na fila da farmácia.<\u002Fh2>\n      <p style=\"font-size:15.5px; line-height:28px; margin:28px 0 0; max-width:48ch; color:color-mix(in srgb, var(--color-text) 78%, transparent)\">Capítulos curtos, selo de evidência ao lado de cada recomendação e referências no fim. Feito para consulta rápida, não para leitura heroica.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"justify-self:end; width:min(400px,100%); border-radius:32px; background:var(--color-accent-100); display:grid; grid-template-rows:auto auto; overflow:hidden; box-shadow:var(--shadow-md)\">\n      <div style=\"padding:28px 28px 0; display:grid; align-content:start\">\n        <div class=\"washed\" style=\"border-radius:20px; overflow:hidden; background:var(--color-bg); padding:10px; box-shadow:var(--shadow-sm)\">\n          <img src=\"64de5b58-78db-4bdd-b8c2-4ccf5004e77a\" alt=\"Caneta de tirzepatida (Mounjaro) apoiada na pele antes da aplicação\" style=\"display:block; width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:14px\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; gap:14px; padding:28px 36px 36px\">\n      <span style=\"font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700)\">E-book em PDF<\u002Fspan>\n      <span style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:26px; line-height:31px\">Guia de Cuidados Durante o Tratamento com Mounjaro<\u002Fspan>\n      <span style=\"font-size:14px; line-height:24px; color:color-mix(in srgb, var(--color-text) 72%, transparent)\">Com selo de força de evidência em cada recomendação<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"duvidas\" style=\"padding:0 0 84px\">\n    <span style=\"display:block; font-size:13px; line-height:14px; letter-spacing:0.06em; text-transform:uppercase; font-weight:600; color:var(--color-accent-700); margin:0 0 14px\">Antes de decidir<\u002Fspan>\n    <h2 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(26px,3vw,34px); line-height:1.2; margin:0 0 36px\">Perguntas justas, respostas diretas.<\u002Fh2>\n    <div style=\"display:grid; gap:28px; max-width:64ch\">\n      <div>\n        <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:22px; line-height:28px; margin:0\">“Isso substitui meu médico?”<\u002Fh3>\n        <p style=\"font-size:15.5px; line-height:28px; margin:14px 0 0; color:color-mix(in srgb, var(--color-text) 80%, transparent)\">Não. É material educativo para complementar — nunca substituir — o acompanhamento do seu médico e, idealmente, de um(a) nutricionista. Ele existe para te ajudar a fazer as perguntas certas e entender o que está sentindo.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:22px; line-height:28px; margin:0\">“Funciona pra quem ainda não começou?”<\u002Fh3>\n        <p style=\"font-size:15.5px; line-height:28px; margin:14px 0 0; color:color-mix(in srgb, var(--color-text) 80%, transparent)\">Sim. O guia também ajuda quem está decidindo se vai começar, explicando o mecanismo e o que esperar com base em evidência real.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:22px; line-height:28px; margin:0\">“Já tentei buscar isso de graça no TikTok.”<\u002Fh3>\n        <p style=\"font-size:15.5px; line-height:28px; margin:14px 0 0; color:color-mix(in srgb, var(--color-text) 80%, transparent)\">E é exatamente por isso que este guia existe: para organizar, com fonte, o que hoje está espalhado e contraditório.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"comprar\" style=\"padding:0 0 56px\">\n    <div style=\"background:var(--color-accent-2-100); border-radius:32px; padding:56px clamp(24px,4vw,64px)\">\n      <h2 style=\"font-family:var(--font-heading); font-weight:var(--font-heading-weight); font-size:clamp(28px,3.4vw,38px); line-height:1.15; margin:0; max-width:22ch\">Comece o tratamento sabendo o porquê de cada cuidado.<\u002Fh2>\n      <p style=\"font-size:16px; line-height:28px; margin:28px 0 0; max-width:56ch; color:color-mix(in srgb, var(--color-text) 80%, transparent)\">Guia completo em PDF, com selo de evidência em cada recomendação. Garantia incondicional de 7 dias: se não fizer sentido pra você, devolvemos 100%.<\u002Fp>\n      <div style=\"display:flex; gap:var(--space-3); flex-wrap:wrap; margin-top:28px\">\n        <a href=\"{{ checkoutUrl }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-primary\" style=\"text-decoration:none; min-height:44px; padding-inline:28px\">Quero o guia completo agora<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:0 0 56px; font-size:13px; line-height:24px; max-width:70ch; color:color-mix(in srgb, var(--color-text) 70%, transparent)\">Conteúdo educativo. Não substitui consulta, diagnóstico ou tratamento médico. Mounjaro® é marca de terceiros; este material não possui vínculo com o fabricante. Procure sempre orientação do seu médico antes de mudar qualquer conduta do tratamento.<\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;checkoutUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://pay.hotmart.com/W106975250E&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Checkout&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      checkoutUrl: this.props.checkoutUrl ?? 'https://pay.hotmart.com/W106975250E',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
